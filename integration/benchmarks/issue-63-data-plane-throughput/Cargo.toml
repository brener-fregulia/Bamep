# Issue #63 Spike — THROWAWAY endpoint-capture data-plane throughput benchmark.
#
# NOT production. NOT the Bamep Agent, NOT `crates/agent`, NOT the `bamepd`
# composition root, NOT a new transport. Standalone workspace. It reuses the
# REAL current components verbatim:
#
#   - Agent side:  `bamep_simulator::DataPlaneClient` + `AgentProofKey` +
#                  `AgentTransferAuthorization` (the exact per-request proof)
#                  + `pinned_tls13_client_config` (exact leaf pin, TLS 1.3);
#   - Worker side: `bamep_worker::data_plane::DataPlane` (Axum + axum-server,
#                  the real `/api/data/v1/` router) + the real E1
#                  `worker_control` client + the real D1 `FilesystemChunkStore`
#                  staging/fsync/linkat + the real D2 `FullArtifactHasher`.
#
# `bamepd` is faked by a UDS auto-responder (ADR-0018: every host integration
# test fakes bamepd; the real bamepd+PostgreSQL durable-commit cost is a
# Phase B / physical-lab measurement, NOT this harness). The fake-bamepd
# authorize/commit interval is therefore ~0 and is reported as such.
#
# Scope so far: Phase A1/A2 baseline, Case B (8->64 MiB), and the chunk-size
# knee + upper sweeps (8/16/32/64 then 32/64/96/128 MiB). NO keep-alive,
# pipelining, parallel uploads or connection reuse — Cases C/D/E are NOT
# implemented. See README.md and runs/*-FINDINGS.md.
[package]
name = "bamep-issue63-data-plane-throughput-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "bamep-issue63-data-plane-throughput-bench"
path = "src/main.rs"

[dependencies]
bamep-worker = { path = "../../../crates/worker" }
bamep-worker-protocol = { path = "../../../crates/worker-protocol" }
bamep-simulator = { path = "../../../crates/simulator" }
bamep-trusted-bootstrap = { path = "../../../crates/trusted-bootstrap" }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "io-util",
    "macros",
    "sync",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
