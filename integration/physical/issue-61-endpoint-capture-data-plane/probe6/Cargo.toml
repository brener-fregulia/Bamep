# Issue #61 CP6 — WinPE-native one-chunk physical data-plane probe.
#
# THROWAWAY Spike artifact. NOT production, NOT the Bamep Agent, NOT crates/agent.
# Standalone workspace. Reuses the EXISTING M1 reference components from
# bamep-simulator (DataPlaneClient + AgentProofKey + AgentTransferAuthorization +
# proof transcript + connect_pinned_wss + authenticate + send_inventory_report);
# no second transfer protocol, no sync re-implementation.
#
# CP6 transfers EXACTLY ONE real 8 MiB physical chunk (index 0) + one idempotent
# retry, then STOPS. It never seals, reconstructs, verifies, or sends
# ActionResult{Succeeded}.
[package]
name = "bamep-issue61-cp6-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "bamep-issue61-cp6-probe"
path = "src/main.rs"

[dependencies]
bamep-simulator = { path = "../../../../crates/simulator" }
bamep-agent-protocol = { path = "../../../../crates/agent-protocol" }
bamep-trusted-bootstrap = { path = "../../../../crates/trusted-bootstrap" }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
getrandom = "0.2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
