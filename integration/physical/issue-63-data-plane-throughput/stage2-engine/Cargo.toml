# Issue #63 Stage 2 — pure off-device matrix engine (THROWAWAY Spike authority).
#
# NOT product architecture, NOT a production Agent, NOT the Bamep control plane.
# Pure, deterministic, host-testable logic ONLY: the exact 36-case physical
# matrix plan, chunk-size/extent arithmetic, the physical source-safety
# predicate (fail-closed, zero-bulk-read on rejection), the Stage-3 disk-budget
# preflight, the typed per-case lifecycle + fail/contaminate policy, the
# per-case result schema, and the measured-only aggregation / paired-ratio
# analysis. NO network, NO database, NO filesystem, NO device, NO Windows.
#
# Standalone workspace so it never joins the main Bamep workspace (same reason
# as `../coordinator`). Consumed by the Stage-2 coordinator, the Issue-63
# one-transfer harness, the WinPE transfer probe and the analysis step.
[package]
name = "bamep-i63-stage2-engine"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "bamep_i63_stage2_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
