# Issue #63 Stage 3 — the #61/CP7-shaped real Server/Postgres/WSS/Worker harness
# for the physical throughput matrix. THROWAWAY Spike scaffolding.
#
# NOT production architecture, NOT `crates/agent`, NOT the `bamepd` composition
# root, NOT the Administrative API. Standalone workspace so it never joins the
# main Bamep workspace. It COMPOSES the same already-proven real boundaries the
# closed Issue #61 CP7A harness used — real PostgreSQL adapter + real
# AgentControlGateway/WSS + real Worker control plane + real Worker HTTPS data
# plane + filesystem chunk store + `TransferTerminalEvidenceService` — and drives
# ONE fresh Transfer/Artifact lineage PER matrix case (36 cases, one long-lived
# enrolled endpoint, runtime-credential rotation between per-case probe
# processes). NO fault injection, NO listener restart: the Issue-63 clean fast
# path. The `bamep_physint_spike` database is used but NEVER created/dropped, and
# the Issue #61 CP6/CP7 lineages are never touched.
#
# The action is the existing `bamep.m1.data-plane-transfer` reference path — NOT
# `bamep.m2.endpoint-capture-transfer` (RF-2 / RF-6 / RF-7 remain unimplemented
# and MUST NOT be implemented here).
[package]
name = "bamep-i63-stage3-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "bamep-i63-stage3-harness"
path = "src/main.rs"

[dependencies]
bamep-domain = { path = "../../../../crates/domain" }
bamep-server = { path = "../../../../crates/server" }
bamep-worker = { path = "../../../../crates/worker" }
bamep-trusted-bootstrap = { path = "../../../../crates/trusted-bootstrap", features = ["fixture-signing"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util", "signal"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "migrate", "json", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
serde_json = "1"

[profile.release]
opt-level = 2
