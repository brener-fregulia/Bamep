# Bamep Spike #53 Phase 9d - throwaway harness. NOT production configuration.
interface=enp8s0
bind-interfaces
port=0
dhcp-authoritative
dhcp-range=192.168.99.50,192.168.99.100,255.255.255.0,1h
dhcp-option=option:router
log-dhcp
log-queries
log-facility=/var/tmp/bamep-issue53-phase9d-winpe-completion/dnsmasq.log
dhcp-leasefile=/var/tmp/bamep-issue53-phase9d-winpe-completion/dnsmasq.leases

enable-tftp=enp8s0
tftp-root=/var/tmp/bamep-issue53-phase9d-winpe-completion/tftp
tftp-no-fail

dhcp-match=set:efi-x64,option:client-arch,7
dhcp-boot=tag:efi-x64,ipxeboot/x86_64-sb/snponly-shim.efi
