# artifact_rootfs_cpio_gz =  1165658 bytes  sha256 57ed483302a5b110eeaffe130cb232cf1ef3a0a329c33d721aef52fc08063eae
#   (bzImage byte-identical across builds on this host; rootfs.cpio.gz hash
#    varies between builds - cpio/gzip embed per-build metadata)
