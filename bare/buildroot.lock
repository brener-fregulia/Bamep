# BARE - Bamep Agent Runtime Environment: pinned Buildroot baseline.
# Issue #72 / ADR-0026.
#
# This file selects the EXACT upstream Buildroot release the BARE image is
# built and validated against. scripts/build-bare.sh reads it and REFUSES to
# build against any other version.
#
# Trust model:
#   - the FIRST pin is authenticated:  scripts/build-bare.sh --pin  downloads
#     the archive and its official PGP signature (buildroot-<v>.tar.xz.sign),
#     fetches the Buildroot signing key, checks the key fingerprint against
#     buildroot_signing_fpr below, verifies the signature, and records the
#     SHA-256 taken from the *signed* text into buildroot_sha256;
#   - every REBUILD then just checks the archive against the pinned SHA-256
#     (local authority - no network trust needed).
#
# Rules (ADR-0026):
#   - never resolve "latest";
#   - never auto-bump to 2026.11 or any later release;
#   - never fall back to another version or series;
#   - changing this baseline is a deliberate ADR-0026 update, not a side effect.
#
# The baseline is Buildroot STABLE 2026.08 (released 2026-09-04). BARE is still
# being established; a maintenance/LTS policy for BARE may pick an LTS series
# later when there is a concrete operational need.

buildroot_version = 2026.08
buildroot_archive = buildroot-2026.08.tar.xz
buildroot_url     = https://buildroot.org/downloads/buildroot-2026.08.tar.xz

# Buildroot release signing identity - Peter Korsgaard (the Buildroot
# maintainer), DSA key, hosted at the URL the .sign message itself points to.
# --pin refuses a key served under any other fingerprint.
buildroot_signing_fpr     = AB07D806D2CE741FB886EE50B025BA8B59C36319
buildroot_signing_key_url = https://buildroot.org/~jacmet/pubkey.gpg

# SHA-256 of buildroot-2026.08.tar.xz, taken from the PGP-signed .sign message
# and cross-checked against the downloaded archive by scripts/build-bare.sh --pin.
buildroot_sha256 = 87aaca4164ea9d5c8085854953018263f7963f07c22e73a2a2185cc98c581c34

# --- Recorded from the owner-run validated build (evidence, not architecture
#     pins; a repeat build may differ - NOT a bit-for-bit claim) ---
