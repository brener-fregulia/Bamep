[package]
name = "bamep-server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "bamep_server"
path = "src/lib.rs"

[[bin]]
name = "bamepd"
path = "src/bin/bamepd.rs"

[dependencies]
bamep-domain = { path = "../domain" }
bamep-agent-protocol = { path = "../agent-protocol" }
bamep-trusted-bootstrap = { path = "../trusted-bootstrap" }
bamep-worker-protocol = { path = "../worker-protocol" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "process", "time", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
url = "2"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "migrate", "json", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
bamep-simulator = { path = "../simulator" }
# Cross-crate interop proofs only (Issue #39 Phases E1/E2A): drives the real
# `bamep_worker` control client + HTTPS data-plane runtime against the real
# `WorkerControlPlane` and real PostgreSQL. Dev-only, one-directional —
# `bamep-worker` never depends on `bamep-server`.
bamep-worker = { path = "../worker" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
rand = "0.8"
# Minimal real-HTTPS test client for the E2A data-plane vertical (all already
# resolved via `bamep-worker`'s `axum`/`axum-server` dependencies).
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
# Compute the SHA-256 chunk/Artifact digests the Phase E2B HTTPS interop test
# declares (already resolved transitively).
sha2 = "0.10"
base64 = "0.22"
