[package]
name = "bamep-worker"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "bamep_worker"
path = "src/lib.rs"

[[bin]]
name = "bamep-worker"
path = "src/main.rs"

[dependencies]
bamep-worker-protocol = { path = "../worker-protocol" }
bamep-trusted-bootstrap = { path = "../trusted-bootstrap" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
# Incremental SHA-256 over staged chunk bytes (Phase D1 chunk storage). Same
# crate/version the rest of the workspace already hashes with
# (`bamep-domain`, `bamep-trusted-bootstrap`, `bamep-simulator`); no `ring`
# coupling for a pure byte hash.
sha2 = "0.10"
# Canonical RFC 4648 base64url-no-pad encoding of a chunk digest, matching the
# convention `bamep-trusted-bootstrap` already uses and the digest text
# `m0-data-plane-and-storage-contracts.md` fixes.
base64 = "0.22"
# Issue #39 Phase E2A — the Worker-owned HTTPS `/api/data/v1/` data-plane
# listener (ADR-0018; the same Axum 0.8 stack ADR-0017 already accepts for
# `bamepd`'s Administrative surface, chosen here to avoid a second unrelated
# Rust HTTP stack). `axum` for exact routing/response building; `axum-server`
# for the smallest rustls TLS-serving + graceful-shutdown integration
# (`tls-rustls-no-provider`: no bundled crypto backend — the Worker feeds its
# own `ring`-built `rustls::ServerConfig`).
axum = { version = "0.8", default-features = false, features = ["json", "tokio"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
# Fixed JSON success/error response bodies for the data-plane contract.
serde_json = "1"
# Issue #39 Phase E2B — stream the `chunk_upload` request body frame-by-frame
# into the blocking D1 staging mechanism without ever materializing a whole
# chunk in memory (`m0-data-plane-and-storage-contracts.md` "Durable chunk
# acceptance ordering"; D1's no-whole-chunk-in-memory guarantee). Only
# `BodyExt::frame` is used; `http-body-util` is already a fully resolved
# transitive dependency of `axum`, so this adds no new code to the build.
http-body-util = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "test-util"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Minimal real-HTTPS test client (Phase E2A integration tests): a raw
# hyper-1 http1 connection over `tokio-rustls`, trusting the exact test leaf.
# All already resolved via `axum`/`axum-server`; declared here only so tests
# may name them.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# A hand-rolled request/`Body` that errors mid-stream, for the `chunk_upload`
# client-disconnect vertical (Phase E2B). Already resolved transitively via
# `axum`; the ordinary-body helper uses the prod `http-body-util` dep above.
http-body = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
